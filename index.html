  <script>
    /* Resolve the colour mode before first paint so the page never flashes. */
    (function () {
      var root = document.documentElement;
      var mode = 'auto';
      try {
        var stored = localStorage.getItem('glyceryl-theme-mode');
        var legacy = localStorage.getItem('glyceryl-theme');
        if (stored === 'auto' || stored === 'light' || stored === 'dark') mode = stored;
        else if (legacy === 'light' || legacy === 'dark') mode = legacy;
      } catch (_) { /* storage disabled */ }
      var prefersDark = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches;
      root.dataset.themeMode = mode;
      root.dataset.theme = mode === 'auto' ? (prefersDark ? 'dark' : 'light') : mode;
    }());
  </script>
