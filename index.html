<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="description" content="Glyceryl's Developer Hub：Minecraft 模组历史教程、Unity 开发笔记、SDK 与开发工具文档。">
  <meta name="theme-color" content="#10182b">
  <meta name="referrer" content="strict-origin-when-cross-origin">
  <title>Glyceryl's Developer Hub · 开发笔记</title>
  <link rel="icon" type="image/svg+xml" href="assets/icons/mark.svg">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/docsify@4/lib/themes/vue.css">
  <link rel="stylesheet" href="assets/css/site.css">
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('glyceryl-theme');
        document.documentElement.dataset.theme = stored === 'light' || stored === 'dark'
          ? stored
          : (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
      } catch (_) {
        document.documentElement.dataset.theme = 'light';
      }
    }());
  </script>
</head>
<body>
  <a class="skip-link" href="#main-content">跳转至正文</a>
  <header class="site-header" role="banner">
    <a class="site-brand" href="#/" aria-label="Glyceryl's Developer Hub 首页">
      <img src="assets/icons/mark.svg" width="34" height="34" alt="" aria-hidden="true">
      <span><strong>Glyceryl</strong><small>Developer Hub</small></span>
    </a>
    <nav class="site-topnav" aria-label="主导航">
      <a data-section="home" href="#/">首页</a>
      <a data-section="minecraft" href="#/minecraft/README.md">Minecraft</a>
      <a data-section="unity" href="#/unity/README.md">Unity</a>
      <a data-section="sdk" href="#/sdk/README.md">SDK</a>
      <a data-section="tools" href="#/tools/README.md">工具</a>
    </nav>
    <div class="header-actions">
      <button id="search-shortcut" type="button" class="header-icon" title="搜索文档" aria-label="搜索文档">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="19" height="19" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 4.5 4.5"/></svg>
      </button>
      <button id="theme-toggle" type="button" class="header-icon" title="切换明暗主题" aria-label="切换明暗主题" aria-pressed="false">
        <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M20.5 13.1A8.8 8.8 0 0 1 10.9 3.5 8.7 8.7 0 1 0 20.5 13.1Z"/></svg>
      </button>
      <a class="header-github" href="https://github.com/Glyceryl6/glyceryl6.github.io" rel="noopener noreferrer" target="_blank" aria-label="GitHub 仓库">GitHub
        <svg aria-hidden="true" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="1.7"><path d="M7 17 17 7M8 7h9v9"/></svg>
      </a>
    </div>
  </header>
  <div id="scroll-progress" aria-hidden="true"></div>
  <div id="main-content" class="main-anchor" tabindex="-1"></div>
  <main id="app" aria-live="polite"><div class="site-loading">正在加载开发文档…</div></main>
  <script src="assets/js/search-paths.js"></script>
  <script>
    window.$docsify = {
      name: 'Glyceryl',
      repo: '',
      basePath: 'docs/',
      homepage: 'home.md',
      loadSidebar: true,
      loadNavbar: false,
      alias: { '/.*/_sidebar.md': '/_sidebar.md' },
      routerMode: 'hash',
      maxLevel: 3,
      subMaxLevel: 2,
      auto2top: true,
      externalLinkTarget: '_blank',
      notFoundPage: '404.md',
      search: {
        maxAge: 86400000,
        paths: window.GlycerylSearchPaths || 'auto',
        depth: 3,
        placeholder: '搜索教程、错误与 API…',
        noData: '没有找到匹配内容'
      },
      plugins: [function (hook) {
        hook.doneEach(function () {
          if (window.GlycerylSite) window.GlycerylSite.onRouteChange();
        });
      }]
    };
  </script>
  <script src="assets/js/site.js" defer></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/docsify.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docsify@4/lib/plugins/search.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-java.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-csharp.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-powershell.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-yaml.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/prismjs@1/components/prism-json.min.js"></script>
</body>
</html>
